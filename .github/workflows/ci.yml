name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.lock
      - name: manifest verifies on checkout
        run: shasum -a 256 -c SHA256SUMS
      - name: tests
        run: PYTHONPATH=src python -m pytest tests/ -q
      - name: synthetic validation must PASS
        run: PYTHONPATH=src python examples/run_synthetic_validation.py
      - name: frozen files unchanged after replay
        # The regenerated receipt embeds full-precision floats whose last
        # units differ across BLAS implementations; its logical PASS is
        # asserted by the previous step. Every other frozen file must be
        # byte-identical after replay.
        run: |
          find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          grep -v "results/synthetic_validation_receipt.json" SHA256SUMS | shasum -a 256 -c -
